name: "Prerelease - push a nightly build"
permissions:
  contents: read
  pull-requests: write

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  config: Release

jobs:
  version:
    runs-on: windows-latest
    outputs:
      version_string: ${{ steps.gitversion.outputs.fullSemVer }}
      major_minor_patch: ${{ steps.gitversion.outputs.majorMinorPatch }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install GitVersion

        uses: gittools/actions/gitversion/setup@v3
        with:
          versionSpec: "5.x"

      - name: Determine Version with GitVersion (MSBuild in Proj will do this)
        id: gitversion
        uses: gittools/actions/gitversion/execute@v3
        with:
          useConfigFile: true
          configFilePath: ./GitVersion.yml

      - name: Display version
        run: |
          echo "Full Version: ${{ steps.gitversion.outputs.fullSemVer }}"

  build-project:
    runs-on: windows-latest

    needs: version

    env:
      solution_name: ./uSync.slnx
      test_project: ./uSync.Tests/uSync.tests.csproj
      schema_gen_project: ./uSync.SchemaGenerator/uSync.SchemaGenerator.csproj

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: restore
        run: dotnet restore ${{ env.solution_name}} --locked-mode

      - name: build
        run: dotnet build ${{ env.solution_name }} -c ${{ env.config }} -p:ContinuousIntegrationBuild=true

      - name: test
        run: dotnet test ${{ env.solution_name }}

      - name: Generate AppSettings Schema
        run: dotnet run -c ${{ env.config }} --project ${{ env.schema_gen_project}}

  package-up:
    runs-on: windows-latest

    needs: [build-project, version]

    env:
      solution_name: ./uSync.slnx

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: version
        run: |
          echo "Version: ${{ needs.version.outputs.version_string}}"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: ./uSync.Backoffice.Management.Client/usync-assets/package-lock.json

      - name: Stamp version on NPM Package
        working-directory: ./uSync.Backoffice.Management.Client/usync-assets
        run: npm version ${{ needs.version.outputs.version_string }}

      - name: npm install
        working-directory: ./uSync.Backoffice.Management.Client/usync-assets
        run: npm ci

      - name: npm build
        working-directory: ./uSync.Backoffice.Management.Client/usync-assets
        run: npm run build

      - name: restore
        run: dotnet restore ${{ env.solution_name}} --locked-mode

      - name: Pack for nightly feed
        shell: pwsh
        env:
          nightly_version: ${{ needs.version.outputs.major_minor_patch }}-prerelease.${{ github.run_number }}
          nightly_out: ./nightly-out/
        run: |
          $projects = @(
            "./uSync.Core/uSync.Core.csproj",
            "./uSync.Backoffice/uSync.Backoffice.csproj",
            "./uSync.Backoffice.Management.Api/uSync.Backoffice.Management.Api.csproj",
            "./uSync.Backoffice.Management.Client/uSync.Backoffice.Management.Client.csproj",
            "./uSync.Backoffice.Targets/uSync.Backoffice.Targets.csproj",
            "./uSync.History/uSync.History.csproj",
            "./uSync/uSync.csproj",
            "./uSync.Community.Contrib/uSync.Community.Contrib.csproj",
            "./uSync.Community.DataTypeSerializers/uSync.Community.DataTypeSerializers.csproj"
          )
          foreach ($project in $projects) {
            dotnet pack $project -c ${{ env.config }} --output $env:nightly_out /p:version=$env:nightly_version
          }

      - name: Checkout nightly-feed-config
        uses: actions/checkout@v4
        with:
          repository: Jumoo/nightly-feed-config
          token: ${{ secrets.NIGHTLY_FEED_PAT }}
          path: .nightly-feed-config

      - name: Publish to nightly feed
        uses: ./.nightly-feed-config
        with:
          packages: ./nightly-out/
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
