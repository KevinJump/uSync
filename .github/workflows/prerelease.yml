name: "Prerelease - push a nightly build"
permissions:
  contents: read
  pull-requests: write
  # npm trusted publishing - the job exchanges its OIDC token for a short lived
  # publish credential, so there is no npm token secret.
  id-token: write

# Manual only: dotnet-build.yml already builds and tests every PR, so we don't
# need a full build+pack run on every merge to main too.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  config: Release
  out_folder: ./build-out/
  solution_name: ./uSync.slnx
  test_project: ./uSync.Tests/uSync.Tests.csproj
  schema_gen_project: ./uSync.SchemaGenerator/uSync.SchemaGenerator.csproj
  client_folder: ./uSync.Backoffice.Management.Client/usync-assets
  history_client_folder: ./uSync.History/history-client

jobs:
  # One job on purpose: the solution is built once, with the nightly version
  # stamped in, and then tested and packed from that same build (--no-build).
  # Splitting it into build / pack / publish jobs meant three runner start-ups,
  # three checkouts and restores, and a second full build just to pack.
  #
  # Linux rather than Windows: nothing in the build needs Windows, and the ubuntu
  # runners start and build noticeably faster. Project paths are case sensitive
  # here, so the folder names below have to match the repo exactly.
  nightly:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # full history and tags - the version step walks the tags reachable from this commit.
          fetch-depth: 0

      # The next patch after the highest release tag *in this branch's history*, plus the
      # run number: v17.5.0 tagged -> 17.5.1-prerelease.42. The mandated nightly scheme,
      # see jumoo-context's context/jumoo/nightly-feed.md.
      #
      # Not GitVersion: on any branch other than vN/main it treats *every* vN/main as a
      # source branch, so a v17 feature branch could pick up a v18 tag and publish v17 code
      # under an 18.x version. `git tag --merged HEAD` only sees this branch's own tags.
      # Release candidates (-rc1) are skipped, so an rc is never the base.
      #
      # github.run_number is scoped to this workflow and only goes up, so "latest" on the
      # feed always resolves to the newest run.
      - name: Determine nightly version
        id: version
        run: |
          latest=$(git tag --merged HEAD --list 'v*' | sed -E 's/^v//' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          if [ -z "$latest" ]; then
            echo "::error::No release tag found in this branch's history."
            exit 1
          fi
          IFS='.' read -r major minor patch <<< "$latest"
          version="${major}.${minor}.$((patch + 1))-prerelease.${GITHUB_RUN_NUMBER}"
          echo "Last release: $latest -> nightly $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: npm
          cache-dependency-path: |
            ${{ env.client_folder }}/package-lock.json
            ${{ env.history_client_folder }}/package-lock.json

      # Neither client project has an MSBuild target that runs npm (the one in
      # uSync.Backoffice.Management.Client is commented out), and both wwwroot
      # folders are gitignored, so the clients have to be built before dotnet build.
      - name: Stamp version on NPM Package
        working-directory: ${{ env.client_folder }}
        run: npm version ${{ steps.version.outputs.version }} --no-git-tag-version --allow-same-version

      - name: build uSync client
        working-directory: ${{ env.client_folder }}
        run: |
          npm ci
          npm run build

      - name: build history client
        working-directory: ${{ env.history_client_folder }}
        run: |
          npm ci
          npm run build

      # -p:Configuration matters here: uSync.Extend is excluded from the Debug solution
      # configuration (<Build Solution="Debug|*" Project="false" /> in uSync.slnx), so a
      # restore with no configuration defaults to Debug and silently skips it, leaving no
      # project.assets.json for the Release build below to pick up.
      - name: restore
        run: dotnet restore ${{ env.solution_name }} --locked-mode -p:Configuration=${{ env.config }}

      # the version is set here, not at pack time, so the assemblies carry it and the
      # pack steps below can reuse this build instead of rebuilding every project.
      #
      # InformationalVersion is set explicitly so the version shown on the uSync
      # dashboard is the nightly one, without a +{commit sha} suffix.
      - name: build
        run: >-
          dotnet build ${{ env.solution_name }}
          -c ${{ env.config }}
          --no-restore
          -p:ContinuousIntegrationBuild=true
          -p:Version=${{ steps.version.outputs.version }}
          -p:InformationalVersion=${{ steps.version.outputs.version }}

      - name: test
        run: dotnet test ${{ env.test_project }} -c ${{ env.config }} --no-build

      - name: Generate AppSettings Schema
        run: dotnet run -c ${{ env.config }} --project ${{ env.schema_gen_project }} --no-build

      - name: pack
        run: |
          set -euo pipefail
          projects=(
            uSync.Core
            uSync.AutoTemplates
            uSync.BackOffice
            uSync.Backoffice.Management.Api
            uSync.Backoffice.Management.Client
            uSync.BackOffice.Targets
            uSync.Community.Contrib
            uSync.Community.DataTypeSerializers
            uSync.Extend
            uSync.History
            uSync
          )
          for project in "${projects[@]}"; do
            dotnet pack "./$project/$project.csproj" \
              -c ${{ env.config }} \
              --no-build \
              --output ${{ env.out_folder }} \
              -p:Version=${{ steps.version.outputs.version }}
          done

      # NOTE: this workflow only ever runs on manual dispatch. Full releases to
      # nuget.org happen separately, in release.yml, triggered by pushing a
      # v{version} tag. The steps below push these packages to the Jumoo nightly
      # feed instead, so testers can try a build (from main or a feature branch)
      # without waiting for a tagged release.
      - name: Upload nuget file as build artifact
        uses: actions/upload-artifact@v7
        with:
          name: Nuget Build Output
          path: ${{ env.out_folder }}

      # nightly-feed-config is private, and its organization-level Actions
      # access only reaches private repos in the Jumoo org. This repo is public
      # (and outside the org), so `uses: Jumoo/nightly-feed-config@main` can't
      # resolve with the job's own GITHUB_TOKEN. Check the action out locally
      # with a PAT scoped to just that repo, then reference it by local path.
      - name: Checkout nightly-feed-config
        uses: actions/checkout@v7
        with:
          repository: Jumoo/nightly-feed-config
          token: ${{ secrets.NIGHTLY_FEED_PAT }}
          path: .nightly-feed-config

      # Any branch can publish to the nightly feed - this workflow is manual only.
      # A feature branch build gets the same -prerelease.{run} version as a main one,
      # so check which branch a run was from before relying on it.
      - name: Publish to nightly feed
        uses: ./.nightly-feed-config
        with:
          packages: ${{ env.out_folder }}
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

      # @jumoo/usync on npmjs.org, same version as the NuGet packages above, on
      # `next-{major}` (next-17): a plain `npm install @jumoo/usync` still gets the
      # latest release, and the v17 and v18 nightlies don't fight over one `next` tag.
      # Needs a trusted publisher on npmjs.org naming KevinJump/uSync and
      # prerelease.yml (no environment).
      - name: publish npm package
        working-directory: ${{ env.client_folder }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # trusted publishing needs npm >= 11.5.1; the npm bundled with setup-node may be older.
          npm install -g npm@^11.5.1

          # `npm run build` above writes to wwwroot; the published package is ./dist.
          npm run client:build

          npm version "$VERSION" --no-git-tag-version --allow-same-version
          npm publish --tag "next-${VERSION%%.*}"
