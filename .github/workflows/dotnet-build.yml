name: PR Project Build and Test

permissions:
  contents: read
  pull-requests: write

# NOTE: uSync releases from "v{major}/main" - a branch per Umbraco major. Plain "main"
# is kept in the filter so a re-created main, or a branch that hasn't been moved over
# yet, still builds.
on:
  pull_request:
    branches: [ "main", "*/main" ]
    paths-ignore:
      - "**.md"
      - "docs/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  config: Release
  out_folder: ./build-out/
  solution_name: ./uSync.slnx
  test_project: ./uSync.Tests/uSync.Tests.csproj
  schema_gen_project: ./uSync.SchemaGenerator/uSync.SchemaGenerator.csproj

jobs:
  build-project:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      # the client project's build runs `npm run build` via an MSBuild target,
      # so node needs to be available before the dotnet build step below.
      - uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: npm
          cache-dependency-path: |
            ./uSync.Backoffice.Management.Client/usync-assets/package-lock.json
            ./uSync.History/history-client/package-lock.json

      # unlike uSync.Backoffice.Management.Client, uSync.History has no MSBuild target
      # that builds its client automatically - wwwroot is gitignored, so without this
      # the dotnet build below packages whatever (if anything) happens to already be
      # on disk.
      - name: npm install history client
        working-directory: ./uSync.History/history-client
        run: npm ci

      - name: npm build history client
        working-directory: ./uSync.History/history-client
        run: npm run build

      # -p:Configuration matters here: uSync.Extend is excluded from the Debug solution
      # configuration (<Build Solution="Debug|*" Project="false" /> in uSync.slnx), so a
      # restore with no configuration defaults to Debug and silently skips it, leaving no
      # project.assets.json for the Release build below to pick up.
      - name: restore
        run: dotnet restore ${{ env.solution_name }} --locked-mode -p:Configuration=${{ env.config }}

      - name: build
        run: dotnet build ${{ env.solution_name }} -c ${{ env.config }} --no-restore -p:ContinuousIntegrationBuild=true

      - name: test
        run: dotnet test ${{ env.test_project }} -c ${{ env.config }}

      - name: Generate AppSettings Schema
        run: dotnet run -c ${{ env.config }} --project ${{ env.schema_gen_project }}

  history-package:
    name: history package smoke check
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: npm
          cache-dependency-path: ./uSync.History/history-client/package-lock.json

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: npm install history client
        working-directory: ./uSync.History/history-client
        run: npm ci

      - name: npm build history client
        working-directory: ./uSync.History/history-client
        run: npm run build

      - name: package history without publishing
        run: >-
          dotnet pack ./uSync.History/uSync.History.csproj
          -c ${{ env.config }}
          --output ./build-out/history-smoke
          -p:Version=0.0.0-smoke
          -p:RestoreLockedMode=true
          -p:ContinuousIntegrationBuild=true

      # catches missing/empty/truncated/stale packaged assets - e.g. wwwroot left over
      # from a previous build, or a lazy-loaded chunk the pack step failed to pick up.
      - name: verify packaged history assets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $assetsRoot = (Resolve-Path './uSync.History/wwwroot').Path
          $entrypoint = Join-Path $assetsRoot 'App_Plugins/uSync.History/history.js'
          if (-not (Test-Path -LiteralPath $entrypoint -PathType Leaf)) {
            throw 'The History build did not produce history.js'
          }

          $assets = @(Get-ChildItem -LiteralPath $assetsRoot -File -Recurse)
          $packagePath = (Resolve-Path './build-out/history-smoke/uSync.History.0.0.0-smoke.nupkg').Path
          $package = [System.IO.Compression.ZipFile]::OpenRead($packagePath)
          try {
            foreach ($asset in $assets) {
              $relativePath = [System.IO.Path]::GetRelativePath($assetsRoot, $asset.FullName).Replace('\', '/')
              $entry = $package.GetEntry("staticwebassets/$relativePath")
              if ($null -eq $entry -or $asset.Length -eq 0 -or $entry.Length -ne $asset.Length) {
                throw "Missing, empty or truncated History asset: $relativePath"
              }

              $sourceHash = (Get-FileHash -LiteralPath $asset.FullName -Algorithm SHA256).Hash
              $stream = $entry.Open()
              try {
                $packageHash = (Get-FileHash -InputStream $stream -Algorithm SHA256).Hash
              }
              finally {
                $stream.Dispose()
              }

              if ($packageHash -cne $sourceHash) {
                throw "Packaged History asset differs from the build: $relativePath"
              }
            }
          }
          finally {
            $package.Dispose()
          }

          Write-Host "Verified $($assets.Count) generated History assets in $packagePath"
