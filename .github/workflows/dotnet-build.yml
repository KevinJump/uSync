name: "pr - build and test"
permissions:
  contents: read

on:
  pull_request:
    branches: ["*/main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  config: Release

jobs:
  build-project:
    runs-on: windows-latest

    env:
      solution_name: ./uSync.slnx
      test_project: ./uSync.Tests/uSync.tests.csproj
      schema_gen_project: ./uSync.SchemaGenerator/uSync.SchemaGenerator.csproj

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: restore
        run: dotnet restore ${{ env.solution_name }} --locked-mode

      - name: build
        run: dotnet build ${{ env.solution_name }} -c ${{ env.config }} -p:ContinuousIntegrationBuild=true

      - name: test
        run: dotnet test ${{ env.solution_name }}

      - name: generate appsettings schema
        run: dotnet run -c ${{ env.config }} --project ${{ env.schema_gen_project }}

  history-package:
    name: history package smoke check
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: npm install history client
        working-directory: ./uSync.History/history-client
        run: npm ci

      - name: npm build history client
        working-directory: ./uSync.History/history-client
        run: npm run build

      - name: package history without publishing
        run: >-
          dotnet pack ./uSync.History/uSync.History.csproj
          -c ${{ env.config }}
          --output ./build-out/history-smoke
          -p:Version=0.0.0-smoke
          -p:RestoreLockedMode=true
          -p:ContinuousIntegrationBuild=true

      - name: verify packaged history assets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $assetsRoot = (Resolve-Path './uSync.History/wwwroot').Path
          $entrypoint = Join-Path $assetsRoot 'App_Plugins/uSync.History/history.js'
          if (-not (Test-Path -LiteralPath $entrypoint -PathType Leaf)) {
            throw 'The History build did not produce history.js'
          }

          $assets = @(Get-ChildItem -LiteralPath $assetsRoot -File -Recurse)
          $packagePath = (Resolve-Path './build-out/history-smoke/uSync.History.0.0.0-smoke.nupkg').Path
          $package = [System.IO.Compression.ZipFile]::OpenRead($packagePath)
          try {
            foreach ($asset in $assets) {
              $relativePath = [System.IO.Path]::GetRelativePath($assetsRoot, $asset.FullName).Replace('\', '/')
              $entry = $package.GetEntry("staticwebassets/$relativePath")
              if ($null -eq $entry -or $asset.Length -eq 0 -or $entry.Length -ne $asset.Length) {
                throw "Missing, empty or truncated History asset: $relativePath"
              }

              $sourceHash = (Get-FileHash -LiteralPath $asset.FullName -Algorithm SHA256).Hash
              $stream = $entry.Open()
              try {
                $packageHash = (Get-FileHash -InputStream $stream -Algorithm SHA256).Hash
              }
              finally {
                $stream.Dispose()
              }

              if ($packageHash -cne $sourceHash) {
                throw "Packaged History asset differs from the build: $relativePath"
              }
            }
          }
          finally {
            $package.Dispose()
          }

          Write-Host "Verified $($assets.Count) generated History assets in $packagePath"
