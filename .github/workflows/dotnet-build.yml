name: PR Project Build and Test

permissions:
  contents: read
  pull-requests: write

# When this builds (Jumoo/jumoo-context#159, from its templates/workflows/dotnet-build.yml):
#
# - Dependabot PRs. Nobody builds those locally, so CI is the only check they get.
# - Other PRs: no. /commit-pr builds and tests locally before opening the PR. The
#   build job is skipped, which still satisfies a required status check.
# - Nightly: each v{N}/main with commits in the last day, so a break from combined
#   changes shows up the next morning. Dispatched, so each branch builds with its own
#   copy of this file.
# - On demand: Actions > Run workflow, on any branch.
#
# NOTE: uSync releases from "v{major}/main" - a branch per Umbraco major. Plain "main"
# is kept in the filter so a re-created main, or a branch that hasn't been moved over
# yet, still builds.
on:
  pull_request:
    branches: [ "main", "*/main" ]
    paths-ignore:
      - "**.md"
      - "docs/**"
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  config: Release
  out_folder: ./build-out/
  solution_name: ./uSync.slnx
  test_project: ./uSync.Tests/uSync.Tests.csproj
  schema_gen_project: ./uSync.SchemaGenerator/uSync.SchemaGenerator.csproj

jobs:
  # Schedules only run on the default branch, so this job dispatches the build on each
  # release branch that changed, rather than building it here.
  nightly:
    if: ${{ github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: dispatch a build for each branch changed in the last day
        run: |
          since=$(date -u -d '25 hours ago' +%s)
          gh api "repos/$GITHUB_REPOSITORY/branches" --paginate -q '.[].name' \
            | grep -E '^(v[0-9]+/)?main$' \
            | while read -r branch; do
                committed=$(gh api "repos/$GITHUB_REPOSITORY/commits/$branch" -q .commit.committer.date)
                if [ "$(date -u -d "$committed" +%s)" -ge "$since" ]; then
                  echo "$branch changed $committed - building"
                  # an old branch (v13/main) may not have this workflow; don't let it stop the rest
                  gh workflow run dotnet-build.yml --repo "$GITHUB_REPOSITORY" --ref "$branch" \
                    || echo "::warning::couldn't dispatch a build on $branch"
                else
                  echo "$branch unchanged since $committed - skipping"
                fi
              done

  # Linux rather than Windows: nothing in the build needs Windows, and the ubuntu
  # runners start and build noticeably faster. It also means a path whose casing
  # doesn't match the repo fails here, on the PR, rather than in a release.
  build-project:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      # node is needed for the history client build below.
      - uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: npm
          cache-dependency-path: |
            ./uSync.Backoffice.Management.Client/usync-assets/package-lock.json
            ./uSync.History/history-client/package-lock.json

      # uSync.History has no MSBuild target that builds its client automatically -
      # wwwroot is gitignored, so without this the dotnet build below packages
      # whatever (if anything) happens to already be on disk.
      - name: npm install history client
        working-directory: ./uSync.History/history-client
        run: npm ci

      - name: npm build history client
        working-directory: ./uSync.History/history-client
        run: npm run build

      # -p:Configuration matters here: uSync.Extend is excluded from the Debug solution
      # configuration (<Build Solution="Debug|*" Project="false" /> in uSync.slnx), so a
      # restore with no configuration defaults to Debug and silently skips it, leaving no
      # project.assets.json for the Release build below to pick up.
      - name: restore
        run: dotnet restore ${{ env.solution_name }} --locked-mode -p:Configuration=${{ env.config }}

      - name: build
        run: dotnet build ${{ env.solution_name }} -c ${{ env.config }} --no-restore -p:ContinuousIntegrationBuild=true

      - name: test
        run: dotnet test ${{ env.test_project }} -c ${{ env.config }} --no-build

      - name: Generate AppSettings Schema
        run: dotnet run -c ${{ env.config }} --project ${{ env.schema_gen_project }} --no-build

  history-package:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]')
    name: history package smoke check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: npm
          cache-dependency-path: ./uSync.History/history-client/package-lock.json

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: npm install history client
        working-directory: ./uSync.History/history-client
        run: npm ci

      - name: npm build history client
        working-directory: ./uSync.History/history-client
        run: npm run build

      - name: package history without publishing
        run: >-
          dotnet pack ./uSync.History/uSync.History.csproj
          -c ${{ env.config }}
          --output ./build-out/history-smoke
          -p:Version=0.0.0-smoke
          -p:RestoreLockedMode=true
          -p:ContinuousIntegrationBuild=true

      # catches missing/empty/truncated/stale packaged assets - e.g. wwwroot left over
      # from a previous build, or a lazy-loaded chunk the pack step failed to pick up.
      - name: verify packaged history assets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $assetsRoot = (Resolve-Path './uSync.History/wwwroot').Path
          $entrypoint = Join-Path $assetsRoot 'App_Plugins/uSync.History/history.js'
          if (-not (Test-Path -LiteralPath $entrypoint -PathType Leaf)) {
            throw 'The History build did not produce history.js'
          }

          $assets = @(Get-ChildItem -LiteralPath $assetsRoot -File -Recurse)
          $packagePath = (Resolve-Path './build-out/history-smoke/uSync.History.0.0.0-smoke.nupkg').Path
          $package = [System.IO.Compression.ZipFile]::OpenRead($packagePath)
          try {
            foreach ($asset in $assets) {
              $relativePath = [System.IO.Path]::GetRelativePath($assetsRoot, $asset.FullName).Replace('\', '/')
              $entry = $package.GetEntry("staticwebassets/$relativePath")
              if ($null -eq $entry -or $asset.Length -eq 0 -or $entry.Length -ne $asset.Length) {
                throw "Missing, empty or truncated History asset: $relativePath"
              }

              $sourceHash = (Get-FileHash -LiteralPath $asset.FullName -Algorithm SHA256).Hash
              $stream = $entry.Open()
              try {
                $packageHash = (Get-FileHash -InputStream $stream -Algorithm SHA256).Hash
              }
              finally {
                $stream.Dispose()
              }

              if ($packageHash -cne $sourceHash) {
                throw "Packaged History asset differs from the build: $relativePath"
              }
            }
          }
          finally {
            $package.Dispose()
          }

          Write-Host "Verified $($assets.Count) generated History assets in $packagePath"
