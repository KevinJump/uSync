# Based on templates/dependabot.yml in Jumoo/jumoo-context.
version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "monthly"
    # Umbraco and our own packages (Jumoo.*, which ship one branch per Umbraco major) set
    # the minimum for anyone installing this package, so they move when we move them.
    # This also opts them out of dependabot security updates.
    ignore:
      - dependency-name: "Umbraco.*"
      - dependency-name: "Jumoo.*"
      # The Clean starter kit major tracks the Umbraco major (7 for v17, 8 for v18, 9 for v19).
      - dependency-name: "Clean"
        update-types: ["version-update:semver-major"]
    groups:
      nuget-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/uSync.Backoffice.Management.Client/usync-assets"
    schedule:
      interval: "monthly"
    ignore:
      # pinned for the same reason as Umbraco.* / Jumoo.* above.
      - dependency-name: "@umbraco-cms/*"
      - dependency-name: "@jumoo/*"
      # The @microsoft/signalr major tracks the .NET major. v17 and v18 run .NET 10 so stay
      # on signalr 10; v19 (.NET 11) takes 11.
      - dependency-name: "@microsoft/signalr"
        versions: [">= 11.0.0"]
      # TypeScript stays below v7: @hey-api/openapi-ts (generates the API client) doesn't
      # support TypeScript 7 yet. Move every client together once it does.
      - dependency-name: "typescript"
        versions: [">= 7.0.0"]
      # @hey-api/* is still 0.x, so a minor bump is a breaking one.
      - dependency-name: "@hey-api/*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      npm-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/uSync.History/history-client"
    schedule:
      interval: "monthly"
    ignore:
      - dependency-name: "@umbraco-cms/*"
      - dependency-name: "@jumoo/*"
      # The @microsoft/signalr major tracks the .NET major. v17 and v18 run .NET 10 so stay
      # on signalr 10; v19 (.NET 11) takes 11.
      - dependency-name: "@microsoft/signalr"
        versions: [">= 11.0.0"]
      - dependency-name: "typescript"
        versions: [">= 7.0.0"]
      - dependency-name: "@hey-api/*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      npm-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
