# Keep the built-in templates (bug report, feature request, beta feedback) available
# alongside this link - unlike some Jumoo repos, issues for uSync are tracked here.
blank_issues_enabled: true

contact_links:
  # /security/policy rather than a blob url - it resolves whatever the default branch
  # is, so it survives the branch being renamed per Umbraco major.
  - name: Report a security issue
    url: https://github.com/KevinJump/uSync/security/policy
    about: Please do not report security problems in public. Email info@jumoo.co.uk instead.
